<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Predictor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 30px 16px;
      color: #172033;
    }

    .container {
      max-width: 480px;
      margin: 40px auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 28px #00000012;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .notice {
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Student Performance Predictor</h1>

    <p>Enter the details below to test the machine-learning model.</p>

    <form id="predictionForm">
      <label for="study_hours">Study hours per day</label>
      <input
        id="study_hours"
        type="number"
        min="0"
        max="24"
        step="0.5"
        value="5"
        required
      >

      <label for="attendance">Attendance (%)</label>
      <input
        id="attendance"
        type="number"
        min="0"
        max="100"
        value="75"
        required
      >

      <label for="previous_score">Previous score (%)</label>
      <input
        id="previous_score"
        type="number"
        min="0"
        max="100"
        value="60"
        required
      >

      <button id="predictButton" type="submit">Predict</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="notice">
      Demonstration only. The model uses illustrative training data
      and should not be used to make real academic decisions.
    </p>
  </main>

  <script>
    const form = document.getElementById("predictionForm");
    const result = document.getElementById("result");
    const button = document.getElementById("predictButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      result.textContent = "Getting prediction...";

      const data = {
        study_hours: Number(document.getElementById("study_hours").value),
        attendance: Number(document.getElementById("attendance").value),
        previous_score: Number(document.getElementById("previous_score").value)
      };

      try {
        const response = await fetch("http://127.0.0.1:5000/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const output = await response.json();

        if (!response.ok) {
          throw new Error(output.error || "Request failed");
        }

        result.textContent = "Prediction: " + output.prediction;
      } catch (error) {
        result.textContent =
          "Could not get prediction. Check that your Flask API is running. " +
          error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
